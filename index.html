<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/images/cc-logo-blue.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/cc-logo-white.png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title -->
    <title>CC Wedding</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Join us on our big day. RSVP Now."
    />

    <!-- Open Graph / Facebook / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ccwedding.page/" />
    <meta property="og:title" content="CC Wedding" />
    <meta
      property="og:description"
      content="Join us on our big day. RSVP Now."
    />
    <meta
      property="og:image"
      content="https://www.ccwedding.page/images/ogdefault.png"
    />
    <meta
      property="og:image:alt"
      content="CC Wedding — Charlon & Chilzia"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CC Wedding" />
    <meta
      name="twitter:description"
      content="Join us on our big day. RSVP Now."
    />
    <meta
      name="twitter:image"
      content="https://www.ccwedding.page/images/ogdefault.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
